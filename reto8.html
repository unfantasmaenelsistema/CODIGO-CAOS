<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El buscador sin filtros · CÓDIGO CAOS</title>
<link rel="icon" href="icono.png">
<script>
  // Tema antes de pintar, para que no parpadee
  (function(){var t=null;try{t=localStorage.getItem('cc-theme');}catch(e){}
  if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cc.css">
</head>
<body data-reto="8">
<div id="cc-header"></div>
<main>
  <div id="cc-top"></div>
  <div class="term">
    <div class="term-bar" id="cc-bar"></div>
    <div class="term-body">
      <h1><span class="pre">&gt;</span> <span data-i18n="title">El buscador sin filtros</span></h1>
      <div data-i18n-html="story"></div>
      <form id="searchForm" autocomplete="off">
        <label class="field"><span data-i18n="searchLbl"></span><input id="searchInput" spellcheck="false"></label>
        <button type="submit" class="btn" style="margin-top:14px" data-i18n="searchBtn"></button>
      </form>
      <div class="stage"><span class="lbl" data-i18n="resultLbl"></span><div id="resultOutput"></div></div>
      <div id="cc-flag"></div>
    </div>
  </div>
</main>
<div id="cc-footer"></div>
<script src="assets/cc.js"></script>
<script src="js/reto8.js"></script>
</body>
</html>
